name: Update Profile Assets

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate profile assets
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, html
          from pathlib import Path
          from collections import Counter

          user = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]
          out = Path("profile")
          out.mkdir(exist_ok=True)

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          user_data = api(f"https://api.github.com/users/{user}")
          repos = api(f"https://api.github.com/users/{user}/repos?per_page=100&sort=updated")

          public_repos = user_data.get("public_repos", 0)
          followers = user_data.get("followers", 0)
          following = user_data.get("following", 0)
          stars = sum(r.get("stargazers_count", 0) for r in repos)
          forks = sum(r.get("forks_count", 0) for r in repos)

          def esc(s):
              return html.escape(str(s))

          def svg_start(w, h):
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" '
                  f'viewBox="0 0 {w} {h}">'
                  f'<rect width="100%" height="100%" rx="12" fill="#0D1117"/>'
                  f'<rect x="0.5" y="0.5" width="{w-1}" height="{h-1}" rx="12" fill="none" stroke="#30363D"/>'
              )

          stats = svg_start(495, 175)
          stats += '<text x="28" y="38" fill="#A78BFA" font-family="Arial, sans-serif" font-size="19" font-weight="700">GitHub Statistics</text>'
          stats += f'<text x="28" y="80" fill="#F0F6FC" font-family="Arial, sans-serif" font-size="26" font-weight="700">{public_repos}</text>'
          stats += '<text x="28" y="103" fill="#8B949E" font-family="Arial, sans-serif" font-size="12">PUBLIC REPOSITORIES</text>'
          stats += f'<text x="185" y="80" fill="#F0F6FC" font-family="Arial, sans-serif" font-size="26" font-weight="700">{followers}</text>'
          stats += '<text x="185" y="103" fill="#8B949E" font-family="Arial, sans-serif" font-size="12">FOLLOWERS</text>'
          stats += f'<text x="330" y="80" fill="#F0F6FC" font-family="Arial, sans-serif" font-size="26" font-weight="700">{stars}</text>'
          stats += '<text x="330" y="103" fill="#8B949E" font-family="Arial, sans-serif" font-size="12">STARS</text>'
          stats += f'<text x="28" y="145" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="12">Forks: {forks}</text>'
          stats += f'<text x="185" y="145" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="12">Following: {following}</text>'
          stats += '</svg>'
          (out / "stats.svg").write_text(stats, encoding="utf-8")

          langs = Counter(r.get("language") for r in repos if r.get("language"))
          top = langs.most_common(6)
          total = sum(langs.values()) or 1

          language_svg = svg_start(495, 175)
          language_svg += '<text x="28" y="38" fill="#A78BFA" font-family="Arial, sans-serif" font-size="19" font-weight="700">Languages</text>'
          y = 68
          for name, count in top:
              pct = round(count / total * 100)
              language_svg += f'<text x="28" y="{y}" fill="#F0F6FC" font-family="Arial, sans-serif" font-size="12">{esc(name)}</text>'
              language_svg += f'<text x="440" y="{y}" fill="#8B949E" text-anchor="end" font-family="Arial, sans-serif" font-size="12">{pct}%</text>'
              language_svg += f'<rect x="28" y="{y+8}" width="412" height="5" rx="2.5" fill="#21262D"/>'
              language_svg += f'<rect x="28" y="{y+8}" width="{max(8, int(412*pct/100))}" height="5" rx="2.5" fill="#6D28D9"/>'
              y += 21
          language_svg += '</svg>'
          (out / "languages.svg").write_text(language_svg, encoding="utf-8")

          events = api(f"https://api.github.com/users/{user}/events/public?per_page=100")
          activity_days = Counter()
          for e in events:
              if e.get("type") == "PushEvent":
                  date = e.get("created_at", "")[:10]
                  activity_days[date] += len(e.get("payload", {}).get("commits", []))

          activity = svg_start(990, 220)
          activity += '<text x="28" y="38" fill="#A78BFA" font-family="Arial, sans-serif" font-size="19" font-weight="700">Recent Contribution Activity</text>'
          activity += '<text x="28" y="62" fill="#8B949E" font-family="Arial, sans-serif" font-size="12">Recent public push activity returned by the GitHub API</text>'
          dates = sorted(activity_days)[-30:]
          maxv = max([activity_days[d] for d in dates], default=1)
          x = 30
          for d in dates:
              v = activity_days[d]
              h = max(4, int(110 * v / maxv)) if maxv else 4
              activity += f'<rect x="{x}" y="{185-h}" width="18" height="{h}" rx="3" fill="#6D28D9"/>'
              activity += f'<text x="{x+9}" y="205" fill="#8B949E" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">{d[5:]}</text>'
              x += 28
              if x > 950:
                  break
          activity += '</svg>'
          (out / "activity.svg").write_text(activity, encoding="utf-8")
          PY

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-contribution-grid-snake.svg?palette=github-light
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet || git commit -m "chore: update profile assets"
          git push
